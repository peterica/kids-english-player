services:
  app:
    build: .
    image: kids-english-player-v2
    container_name: kids-english-player-v2
    restart: unless-stopped
    ports:
      # 호스트 포트만 바꾸려면 .env 에 PORT=3300 처럼 지정한다.
      - "${PORT:-3200}:3200"
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      TZ: "${TZ:-Asia/Seoul}"
      # 세션 쿠키 서명 키. 없으면 기동을 중단한다(빈 값으로 뜨는 사고 방지).
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required. Run: cp .env.example .env && openssl rand -hex 48}"
      # 비워 두면 Content Library 읽기 API 가 공개된다. 값을 넣으면 토큰이 필요하다.
      CONTENT_LIBRARY_TOKEN: "${CONTENT_LIBRARY_TOKEN:-}"
    volumes:
      # SQLite 파일은 호스트 ./data 에 남는다. 백업은 이 폴더만 복사하면 된다.
      - ./data:/app/data
