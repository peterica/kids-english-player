services:
  app:
    build: .
    image: kids-english-player-v2
    container_name: kids-english-player-v2
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      TZ: "Asia/Seoul"
      # .env 에서 주입한다. 세션 쿠키 서명에 사용된다.
      SESSION_SECRET: "${SESSION_SECRET}"
    volumes:
      # SQLite 파일은 호스트 ./data 에 남는다. 백업은 이 폴더만 복사하면 된다.
      - ./data:/app/data
